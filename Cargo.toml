[package]
authors = ["Iven Beck <ivbeck@mail.uni-mannheim.de>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "multilayer-perceptron"
description = "A simple Rust project using Nix"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
console-subscriber = "0.4.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16.0"
csv = "1.3.0"
anyhow = "1.0"


[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
macro_expanded_macro_exports_accessed_by_absolute_paths = "allow" # needed for ambassador to work

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }
# missing_docs_in_private_items = "deny"
unwrap_in_result = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "deny"
missing_const_for_fn = "deny"
missing_errors_doc = "deny"
print_stdout = "deny"
print_stderr = "deny"
enum_glob_use = "deny"
match-wild-err-arm = "warn"
significant_drop_in_scrutinee = "warn"
clone_on_ref_ptr = "warn"
use_self = "warn"
must_use_candidate = "warn"
self_named_module_files = "allow"
